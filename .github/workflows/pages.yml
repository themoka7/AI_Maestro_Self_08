name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['gas/Index.html', 'gas/Core.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GAS 화면(Index.html)과 로직(Core.js)을 그대로 데모로 올린다.
      - name: Build demo
        run: |
          mkdir -p _site
          cp gas/Index.html _site/index.html
          cp gas/Core.js _site/core.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
